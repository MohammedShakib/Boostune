<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#00c8f0"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#c7e8ff" stop-opacity="0.85"/>
    </linearGradient>
    <clipPath id="circle">
      <circle cx="64" cy="64" r="60"/>
    </clipPath>
  </defs>

  <!-- Background circle -->
  <circle cx="64" cy="64" r="62" fill="url(#bgGrad)"/>

  <!-- Subtle inner highlight -->
  <circle cx="64" cy="64" r="62" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>
  <ellipse cx="50" cy="32" rx="28" ry="14" fill="rgba(255,255,255,0.08)"/>

  <!-- Bold "B" letterform (offset left to leave room for waves) -->
  <text
    x="22"
    y="90"
    font-family="Arial, Helvetica, sans-serif"
    font-size="76"
    font-weight="900"
    fill="url(#waveGrad)"
    letter-spacing="-2"
  >B</text>

  <!-- Sound wave arcs (3 concentric arcs to the right of B) -->
  <!-- Inner arc -->
  <path
    d="M 82,46 A 20,20 0 0 1 82,82"
    fill="none"
    stroke="url(#waveGrad)"
    stroke-width="6"
    stroke-linecap="round"
  />
  <!-- Mid arc -->
  <path
    d="M 92,36 A 32,32 0 0 1 92,92"
    fill="none"
    stroke="url(#waveGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.75"
  />
  <!-- Outer arc -->
  <path
    d="M 102,26 A 44,44 0 0 1 102,102"
    fill="none"
    stroke="url(#waveGrad)"
    stroke-width="6"
    stroke-linecap="round"
    stroke-opacity="0.5"
  />
</svg>
